name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup update stable
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: deskframe
          path: |
            target/release/deskframe.exe
            LICENSE
            THIRD-PARTY-NOTICES
